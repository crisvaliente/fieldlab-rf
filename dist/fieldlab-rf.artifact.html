<title>FieldLab RF</title>
<meta name="claude:viewport-fit-sides" content="cover">

:root {

    --ap: #a892ff; --ma: #ff9a4d; --mb: #3ecdbb; --wall: #e58e79;
    --ok: #62d18c; --bad: #ff8d84; --warn: #f0c060; --focus: #6ea8ff; --inv: #0f151b;

  }
}
:root[data-theme="dark"] {

  --ap: #a892ff; --ma: #ff9a4d; --mb: #3ecdbb; --wall: #e58e79;
  --ok: #62d18c; --bad: #ff8d84; --warn: #f0c060; --focus: #6ea8ff; --inv: #0f151b;

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px;
}
#root { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; border-bottom: 2px solid var(--fg); padding-bottom: 8px; }
.eyebrow { font: 600 11px/1 var(--cond); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
h1 { font: 600 26px/1 var(--cond); letter-spacing: 0.01em; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }

.app { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stage { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 10px; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tabpanel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (max-width: 980px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; }
  .app[data-tab="exp"] .stage, .app[data-tab="data"] .stage, .app[data-tab="learn"] .stage { display: none; }
  .app[data-tab="exp"] .side, .app[data-tab="data"] .side, .app[data-tab="learn"] .side { order: -1; }
  .app .side { order: 0; }
  input, select, textarea { font-size: 16px; }
}

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--fg); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 7px 12px; min-height: 36px; cursor: pointer; font: 600 13px var(--cond); letter-spacing: 0.04em; }
.seg button + button { border-left: 1px solid var(--fg); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--inv); }
.toolhint { min-height: 0; font-size: 12.5px; color: var(--warn); }
.toolhint:empty { display: none; }
.planwrap { background: var(--bg); border: 1px solid var(--rule); border-radius: 2px; }
#plan { display: block; width: 100%; margin: 0 auto; touch-action: none; cursor: crosshair; font-family: var(--mono); user-select: none; -webkit-user-select: none; }
.planlegend, .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.planlegend > span, .legend > span { display: inline-flex; align-items: center; gap: 6px; }
.layerbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; border-top: 1px solid var(--rule); padding-top: 8px; }
.scalewrap { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; min-width: 0; }
.legend-scale { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); }
.ramp { display: inline-block; width: 120px; height: 10px; border: 1px solid var(--rule); }
.inspector { border-top: 1px solid var(--rule); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.insp-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }

.sym { display: inline-block; width: 11px; height: 11px; flex: none; margin-right: 6px; vertical-align: -1px; }
.planlegend .sym { margin-right: 0; }
.s-rx { background: var(--fg); border-radius: 50%; }
.s-a { border: 2px solid var(--ma); }
.s-b { border: 2px solid var(--mb); transform: rotate(45deg) scale(0.85); }
.s-ap { background: var(--ap); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.s-wall { background: var(--wall); height: 5px; width: 14px; vertical-align: 2px; }
.s-cal { background: var(--muted); width: 5px; height: 5px; border-radius: 50%; vertical-align: 2px; }
.legend i { display: inline-block; width: 10px; height: 10px; }
.k-a { background: var(--ma); }
.k-b { background: var(--mb); transform: rotate(45deg) scale(0.85); }

.tabs { display: flex; gap: 0; overflow-x: auto; border-bottom: 1px solid var(--fg); scrollbar-width: none; }
.tabs button { flex: 1 0 auto; border: 0; border-bottom: 3px solid transparent; background: none; padding: 10px 12px; min-height: 42px; cursor: pointer; font: 600 13px var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }

.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card > div:not(.row):not(.fields):not(.scroll-x) { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
h3 { font: 600 12px/1.2 var(--cond); letter-spacing: 0.12em; text-transform: uppercase; padding-bottom: 6px; border-bottom: 1px solid var(--rule); text-wrap: balance; }
h3 small { font: 400 12px var(--sans); letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 6px; }
h4 { font: 600 12px/1.2 var(--cond); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.fine { font-size: 12.5px; color: var(--muted); max-width: 75ch; }
.muted { color: var(--muted); }
.strong { font-weight: 600; }
code, .mono-s { font-family: var(--mono); font-size: 12px; }
.mono-s { overflow-wrap: anywhere; }

.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.row.measure { align-items: flex-end; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 12.5px; }
.field > span:first-child { color: var(--muted); }
.field small { color: var(--muted); font-size: 11.5px; }
.field.wide { width: 100%; }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }

.inp input:disabled { color: var(--muted); }

.field > input[type="number"], input[type="text"] { font-family: var(--mono); }
textarea { width: 100%; font-family: var(--mono); font-size: 12px; resize: vertical; }
textarea#expHyp { font-family: var(--sans); font-size: 14px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.check input { margin-top: 3px; flex: none; width: 16px; height: 16px; accent-color: var(--fg); }

.btn { border: 1px solid var(--fg); background: var(--panel); border-radius: 3px; padding: 8px 14px; min-height: 38px; cursor: pointer; font: 600 13px var(--cond); letter-spacing: 0.04em; display: inline-flex; align-items: center; }

.btn.primary { background: var(--fg); color: var(--inv); }
.btn.small { padding: 4px 10px; min-height: 30px; font-size: 12px; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.link, button.link { border: 0; background: none; padding: 0; color: var(--ap); font: 600 13px var(--mono); cursor: pointer; text-decoration: underline; min-height: 0; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.chip { display: inline-block; font: 600 11px/1 var(--cond); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 7px; border-radius: 2px; white-space: nowrap; }

.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.synth { background: var(--synth-bg); color: var(--ap); }

.note.warn { border-color: var(--warn); background: var(--warn-bg); }
.note.bad { border-color: var(--bad); background: var(--bad-bg); }
.note.ok { border-color: var(--ok); background: var(--ok-bg); }
.hyp { font-size: 13.5px; border-left: 3px solid var(--fg); padding-left: 10px; max-width: 80ch; }

.scroll-x { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
thead th { font: 600 11px/1.25 var(--cond); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); vertical-align: bottom; white-space: nowrap; }
thead th small { text-transform: none; letter-spacing: 0; font-weight: 400; }
tbody th { font-weight: 600; white-space: nowrap; }
.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.mono-s { white-space: nowrap; }
tr.off { color: var(--muted); }
tr.sel td, tr.sel th { background: var(--plan); }
tr.reason td { color: var(--bad); font-size: 12.5px; border-bottom: 1px solid var(--rule); }
.readout td.strong { font-size: 15px; }

dl.kv { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 3px 14px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
details { border-top: 1px solid var(--rule); padding-top: 8px; display: flex; flex-direction: column; }
details:first-child { border-top: 0; padding-top: 0; }
details > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
details[open] > summary { margin-bottom: 8px; }
details > * + * { margin-top: 8px; }
.prose p + p { margin-top: 8px; }
.prose p, .exercise p, .exercise li { max-width: 70ch; }
.exercise ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
ul.reading { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; max-width: 80ch; }
.formula { border-left: 3px solid var(--fg); padding-left: 12px; display: flex; flex-direction: column; gap: 6px; }
.formula + .formula { margin-top: 4px; }
.eq { font: 14px/1.6 var(--mono); overflow-x: auto; white-space: nowrap; padding-bottom: 2px; }
.runbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; }
.chartbox { overflow-x: auto; }
.chart { display: block; font-family: var(--mono); }
.charttitle { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 8px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

    const int = (v) => Number.isInteger(v);
    const rules = {
      apCount: (v) => int(v) && v >= 1 && v <= nAps || `La cantidad de AP debe ser un entero entre 1 y ${nAps} (los AP encendidos de la escena).`,
      sigma: (v) => v >= 0 && v <= 20 || "\u03C3 debe estar entre 0 y 20 dB.",
      wallAtt: (v) => v >= 0 && v <= 40 || "La atenuaci\xF3n debe estar entre 0 y 40 dB.",
      nAssumed: (v) => v >= 1 && v <= 6 || "n debe estar entre 1 y 6.",
      p0Assumed: (v) => v >= -90 && v <= 0 || "P\u2080 debe estar entre \u221290 y 0 dBm.",
      k: (v) => int(v) && v >= 1 && v <= 50 || "k debe ser un entero entre 1 y 50.",
      gridSpacing: (v) => v >= 0.25 && v <= 10 || "El paso de grilla debe estar entre 0,25 y 10 m.",
      reads: (v) => int(v) && v >= 1 && v <= 50 || "Las lecturas deben ser un entero entre 1 y 50."
    };
    for (const v of parts) {
      const r = rules[X.variable](v);
      if (r !== true) return { error: r };
    }
    if (X.variable === "wallAtt" && !base.env.walls.length) return { error: "La escena no tiene paredes: esta variable no tendr\xEDa ning\xFAn efecto. Dibuj\xE1 una pared o eleg\xED otra escena." };

  function run() {
    X.error = null;
    X.repeat = null;

      X.error = "El n\xFAmero de posiciones debe ser un entero entre 10 y 2000.";
      return renderResults();
    }
    if (!Number.isInteger(X.seed)) {
      X.error = "La semilla debe ser un n\xFAmero entero.";
      return renderResults();
    }
    const pv = parseValues();
    if (pv.error) {
      X.error = pv.error;
      return renderResults();
    }
    const base = baseCfg();
    const errs = validateModel(base.env.model);
    if (errs.length) {
      X.error = errs.join(" ");
      return renderResults();
    }
    const key = JSON.stringify([base, X.variable, pv.values]);
    const t0 = performance.now();
    let result;
    try {
      result = runSweep({ base, variable: X.variable, values: pv.values });
    } catch (e) {
      X.error = `El experimento no pudo ejecutarse: ${e.message}`;
      return renderResults();
    }
    const prev = X.runs.get(key);
    if (prev) X.repeat = { same: prev === result.digest, prev };
    X.runs.set(key, result.digest);
    X.run = { ...result, base, ms: performance.now() - t0, hypothesis: X.hypothesis, description: describe(base) };
    X.cond = Math.min(X.cond, result.conditions.length - 1);

  var CONCEPTS = [
    ["Qu\xE9 representa RSSI", `<p>RSSI (<em>Received Signal Strength Indicator</em>) es la potencia con la que el receptor capta una se\xF1al, expresada en dBm: decibelios respecto de 1 mW. Es una escala logar\xEDtmica: \u221240 dBm es una se\xF1al fuerte, \u221290 dBm est\xE1 cerca del l\xEDmite de detecci\xF3n, y cada \u221210 dB significa diez veces menos potencia.</p><p>En un ESP32 el valor llega como un entero y depende del chip, la antena y su orientaci\xF3n. Dos dispositivos en el mismo lugar pueden informar valores distintos.</p>`],
    ["Por qu\xE9 RSSI no equivale a distancia", `<p>La potencia media s\xED disminuye con la distancia, pero cada lectura individual tambi\xE9n depende de reflexiones, obst\xE1culos, personas, orientaci\xF3n de antenas e interferencia. Como la relaci\xF3n es logar\xEDtmica, un error peque\xF1o en dB se convierte en un error <em>multiplicativo</em> en metros: con n = 2,5, una lectura 3 dB m\xE1s baja de lo esperado alarga la distancia inferida un 32 %, sea a 2 m o a 20 m.</p><p>Probalo en el laboratorio: puls\xE1 \xABNueva medici\xF3n\xBB varias veces sin mover el receptor y mir\xE1 c\xF3mo cambia la columna \xABd inferida\xBB.</p>`],
    ["El exponente de p\xE9rdida de trayectoria n", `<p>n indica con qu\xE9 rapidez cae la potencia al alejarse. En espacio libre vale 2. En interiores suele citarse entre 1,6 (pasillos que gu\xEDan la se\xF1al) y 4 o m\xE1s (ambientes con muchos obst\xE1culos); son valores orientativos de la bibliograf\xEDa, no mediciones de esta aplicaci\xF3n.</p><p>n no es una constante universal: es un par\xE1metro que se ajusta a cada entorno.</p>`],
    ["Qu\xE9 efecto tienen las paredes", `<p>En este modelo, cada pared que corta la l\xEDnea recta entre el AP y el receptor resta una cantidad fija de dB. El m\xE9todo geom\xE9trico no sabe que la pared existe: interpreta esa p\xE9rdida como distancia adicional y desplaza la estimaci\xF3n.</p><p>En la realidad la atenuaci\xF3n depende del material, el espesor, el \xE1ngulo y la frecuencia, y la se\xF1al tambi\xE9n llega por caminos reflejados. Aqu\xED nada de eso se simula.</p>`],
    ["Qu\xE9 significa calibrar un modelo", `<p>Calibrar es elegir los par\xE1metros del modelo (P\u2080 y n) para que reproduzca mediciones hechas en posiciones conocidas del entorno real. En esta aplicaci\xF3n hay dos juegos de par\xE1metros: los del <strong>modelo verdadero</strong>, que genera los datos, y los del <strong>estimador</strong>, que los interpreta. Cuando coinciden, la calibraci\xF3n es correcta. Si los separ\xE1s (pesta\xF1a Modelo), simul\xE1s un estimador mal calibrado.</p><p>El fingerprinting calibra de otra forma: no ajusta par\xE1metros, guarda directamente las mediciones.</p>`],
    ["C\xF3mo funciona k-NN", `<p>Primero se mide el vector de RSSI en una grilla de posiciones conocidas: el mapa de huellas. Para ubicar una medici\xF3n nueva, se calcula su distancia (en dB) a cada huella, se eligen las k m\xE1s parecidas y se promedian sus posiciones.</p><p>No supone ning\xFAn modelo de propagaci\xF3n, as\xED que absorbe paredes y particularidades del lugar. A cambio exige una campa\xF1a de medici\xF3n, su resoluci\xF3n est\xE1 limitada por el paso de la grilla, y el mapa envejece: si se mueve un AP o un mueble grande, hay que recalibrar.</p>`],
    ["Qu\xE9 significa RMSE", `<p>Es la ra\xEDz del error cuadr\xE1tico medio: se eleva cada error al cuadrado, se promedia y se saca la ra\xEDz. Se expresa en metros, igual que la media, pero castiga m\xE1s los errores grandes. Si RMSE es bastante mayor que el error medio, hay unas pocas estimaciones muy malas.</p><p>Aqu\xED siempre se refiere al error <em>espacial</em> (distancia entre posici\xF3n estimada y real), nunca al error de RSSI en dB.</p>`],
    ["Por qu\xE9 funciona en datos sint\xE9ticos y falla en un entorno real", `<p>Los datos sint\xE9ticos salen del mismo modelo que el estimador supone. El algoritmo juega con ventaja: la forma de la ley de propagaci\xF3n es exactamente la correcta y el ruido es gaussiano, independiente y de varianza conocida.</p><p>En un edificio real hay multitrayecto, desvanecimiento correlacionado en el espacio y en el tiempo, antenas no isotr\xF3picas, personas que se mueven, interferencia y diferencias entre dispositivos. Un resultado obtenido aqu\xED indica c\xF3mo se comporta el algoritmo bajo hip\xF3tesis ideales; no predice su precisi\xF3n en campo.</p>`]

  var FORMULAS = `
<div class="formula"><div class="eq">RSSI(d) = P\u2080 + \u0394P \u2212 10\xB7n\xB7log\u2081\u2080( max(d, d\u2080) / d\u2080 ) \u2212 \u03A3 L<sub>pared</sub> + \u03B5</div>

<div class="formula"><div class="eq">d\u0302 = d\u2080 \xB7 10<sup>(P\u2080 \u2212 RSSI) / (10\xB7n)</sup></div><p class="fine">Inversi\xF3n del modelo que usa el m\xE9todo A, con los P\u2080 y n que supone el estimador. Si RSSI \u2265 P\u2080 solo puede afirmarse d\u0302 \u2264 d\u2080.</p></div>
<div class="formula"><div class="eq">p\u0302 = argmin<sub>p</sub> \u03A3<sub>i</sub> w<sub>i</sub> \xB7 ( \u2016p \u2212 a<sub>i</sub>\u2016 \u2212 d\u0302<sub>i</sub> )\xB2,   w<sub>i</sub> = 1 / d\u0302<sub>i</sub>\xB2</div><p class="fine">M\xE9todo A. a<sub>i</sub> es la posici\xF3n del AP i. Se resuelve con Levenberg\u2013Marquardt desde tres puntos de partida.</p></div>
<div class="formula"><div class="eq">D(q, f) = \u221A( (1/M) \xB7 \u03A3<sub>i</sub> (q<sub>i</sub> \u2212 f<sub>i</sub>)\xB2 )</div><p class="fine">M\xE9todo B. Distancia en dB entre el vector medido q y una huella f sobre los M AP del mapa. Un AP sin se\xF1al cuenta como \u2212100 dBm.</p></div>
<div class="formula"><div class="eq">e<sub>j</sub> = \u2016p\u0302<sub>j</sub> \u2212 p<sub>j</sub>\u2016   \xB7   media = (1/N) \u03A3 e<sub>j</sub>   \xB7   RMSE = \u221A( (1/N) \u03A3 e<sub>j</sub>\xB2 )</div><p class="fine">Error espacial de la muestra j, en metros. La mediana y el percentil 90 son los valores por debajo de los cuales queda el 50 % y el 90 % de los errores (interpolaci\xF3n lineal). La tasa de fallos es la fracci\xF3n de intentos sin estimaci\xF3n; esos intentos no entran en las dem\xE1s m\xE9tricas.</p></div>`;

      <div class="card"><h3>Recinto</h3><div class="fields">${num("Ancho", "cfg.env.room.w", 0.5, "m", 2, 60)}${num("Alto", "cfg.env.room.h", 0.5, "m", 2, 60)}</div></div>
      <div class="card"><h3>Modelo verdadero <small>genera los datos sint\xE9ticos</small></h3><div class="fields">
        ${num("P\u2080 \xB7 RSSI de referencia", "cfg.env.model.p0", 1, "dBm", -80, 0)}${num("n \xB7 exponente de p\xE9rdida", "cfg.env.model.n", 0.1, "", 1, 6)}${num("d\u2080 \xB7 distancia de referencia", "cfg.env.model.d0", 0.1, "m", 0.1, 5)}
        ${num("\u03C3 \xB7 ruido por lectura", "cfg.env.model.sigma", 0.5, "dB", 0, 15)}${num("Piso de sensibilidad", "cfg.env.model.floor", 1, "dBm", -120, -60, "Por debajo, la lectura falta")}${num("Semilla", "cfg.seed", 1, "", 0, 4294967295)}</div>
        <p class="fine">Con la misma semilla y los mismos par\xE1metros, todos los n\xFAmeros de la aplicaci\xF3n se repiten exactamente.</p></div>
      <div class="card"><h3>Estimador <small>lo que el m\xE9todo A supone</small></h3>
        ${chk("Calibraci\xF3n correcta: usar los mismos P\u2080 y n que el modelo verdadero", "linked")}
        <div class="fields">${num("P\u2080 supuesto", "cfg.assumed.p0", 1, "dBm", -80, 0)}${num("n supuesto", "cfg.assumed.n", 0.05, "", 1, 6)}</div>
        ${chk("Ponderar cada AP por 1/d\u0302\xB2 (las distancias largas pesan menos)", "cfg.tri.weighted")}
        <p class="fine">El estimador conoce las posiciones de los AP. No conoce las paredes ni el \u0394P de cada AP.</p></div>
      <div class="card"><h3>Fingerprinting <small>m\xE9todo B</small></h3><div class="fields">
        ${num("k vecinos", "cfg.knn.k", 1, "", 1, 50)}${num("Paso de la grilla", "cfg.cal.spacing", 0.25, "m", 0.5, 10)}${num("Lecturas por punto", "cfg.cal.reads", 1, "", 1, 50)}</div>
        ${chk("Ponderar vecinos por 1/(D + \u03B5)", "cfg.knn.weighted")}${chk("Recalibrar autom\xE1ticamente cuando cambia la escena", "autoCal")}
        <div class="row"><button class="btn" id="btnRecal">Recalibrar ahora</button><span class="fine" id="calStatus" role="status"></span></div></div>
      <div class="card"><h3>Escenas</h3><div class="row"><button class="btn" data-scene="live">4 AP y una pared (inicial)</button><button class="btn" data-scene="six">6 AP y dos paredes</button><button class="btn" data-scene="collinear">3 AP en l\xEDnea (geometr\xEDa degenerada)</button></div></div>
    </div>
    <div class="tabpanel" id="tab-exp" role="tabpanel" aria-labelledby="tabbtn-exp" hidden></div>
    <div class="tabpanel" id="tab-data" role="tabpanel" aria-labelledby="tabbtn-data" hidden></div>
    <div class="tabpanel" id="tab-learn" role="tabpanel" aria-labelledby="tabbtn-learn" hidden></div>
  </section>
</main>
<footer class="foot"><span>FieldLab RF \xB7 prototipo de estudio. No es un sistema de localizaci\xF3n ni de seguimiento de personas.</span></footer>`;
  }
  var getPath = (path) => path.split(".").reduce((o, k) => o[k], S);
  function setPath(path, v) {
    const ks = path.split(".");
    const last = ks.pop();
    ks.reduce((o, k) => o[k], S)[last] = v;
  }
  function syncInputs() {
    document.querySelectorAll("[data-bind]").forEach((el) => {
      const v = getPath(el.dataset.bind);
      if (el.type === "checkbox") el.checked = !!v;
      else if (document.activeElement !== el) el.value = Number.isInteger(v) ? v : +Number(v).toFixed(3);
    });
    for (const p of ["cfg.assumed.p0", "cfg.assumed.n"]) {
      const el = document.querySelector(`[data-bind="${p}"]`);
      el.disabled = S.linked;
      if (S.linked) el.value = p.endsWith("p0") ? S.cfg.env.model.p0 : S.cfg.env.model.n;
    }
  }
  function onBound(el, commit) {
    const path = el.dataset.bind;
    if (el.type === "checkbox") {
      if (path === "linked" && !el.checked) {
        S.cfg.assumed.p0 = S.cfg.env.model.p0;
        S.cfg.assumed.n = S.cfg.env.model.n;
      }
      setPath(path, el.checked);
    } else {
      let v = Number(el.value);
      if (el.value === "" || !Number.isFinite(v)) return;
      const lo = Number(el.min), hi = Number(el.max);
      if (v < lo || v > hi) {
        if (!commit) return;
        v = Math.min(hi, Math.max(lo, v));
      }
      if (["cfg.knn.k", "cfg.cal.reads", "reads", "cfg.seed"].includes(path)) v = Math.round(v);
      setPath(path, v);
      if (commit) el.value = v;
      if (path.startsWith("cfg.env.room")) enforceRoom();
    }
    update();
  }
  var heatTimer = null;
  var autoTimer = null;
  function go(tab, presetId) {
    S.tab = tab;
    if (presetId) selectPreset(presetId);
    renderChrome();
    if (tab === "exp") rerenderExperimentCharts();
    if (tab === "lab" || tab === "model") renderPlan();
    document.querySelector(".side").scrollIntoView({ block: "nearest" });
    if (tab === "lab" && matchMedia("(max-width: 980px)").matches) window.scrollTo({ top: 0 });
  }
  function renderChrome() {
    document.getElementById("app").dataset.tab = S.tab;
    for (const [k] of TABS) {
      document.getElementById(`tab-${k}`).hidden = k !== S.tab;
      const b = document.getElementById(`tabbtn-${k}`);
      b.setAttribute("aria-selected", k === S.tab ? "true" : "false");
    }
    document.querySelectorAll("#tools button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tool === S.tool ? "true" : "false"));
    document.getElementById("btnDelete").disabled = !S.selected;
    document.getElementById("toolHint").textContent = S.tool === "ap" ? "Toc\xE1 el plano donde quer\xE9s colocar el punto de acceso." : S.tool === "wall" ? "Arrastr\xE1 sobre el plano para dibujar la pared. Se crea con 6 dB; despu\xE9s pod\xE9s editarla." : "";
    document.getElementById("overlay").value = S.overlay;
    document.getElementById("showCircles").checked = S.showCircles;
    document.getElementById("showCal").checked = S.showCal;
  }
  function render2() {
    renderChrome();
    syncInputs();
    renderPlan();
    renderPositioning(document.getElementById("positioning"));
    renderSignals(document.getElementById("signals"));
    renderIntermediates(document.getElementById("intermediates"));
    const insp = document.getElementById("inspector");
    if (!insp.contains(document.activeElement) || !S.selected) renderInspector(insp);
    const L = S.live;
    document.getElementById("calStatus").textContent = `${S.db.points.length} puntos \xB7 ${L.stale ? "desactualizado respecto de la escena" : "vigente"}`;
    refreshExperimentScene();
    if (S.overlay.startsWith("err") && !S.heat) {
      clearTimeout(heatTimer);
      heatTimer = setTimeout(() => {
        computeHeat();
        renderPlan();
      }, 250);
    }
  }
  function boot() {
    document.getElementById("root").innerHTML = shell();
    initPlan(document.querySelector(".stage"));
    initExperiments(document.getElementById("tab-exp"));
    initData(document.getElementById("tab-data"));
    initLearn(document.getElementById("tab-learn"), go);
    onUpdate(render2);
    document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => go(b.dataset.tab)));
    document.querySelectorAll("#tools button").forEach((b) => b.addEventListener("click", () => {
      S.tool = b.dataset.tool;
      renderChrome();
    }));
    document.getElementById("btnDelete").addEventListener("click", deleteSelected);
    document.getElementById("zoomIn").addEventListener("click", () => zoomBy(1 / 1.3));
    document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1.3));
    document.getElementById("zoomFit").addEventListener("click", () => {
      fitView();
      renderPlan();
    });
    document.getElementById("overlay").addEventListener("change", (e) => {
      S.overlay = e.target.value;
      update();
    });
    document.getElementById("showCircles").addEventListener("change", (e) => {
      S.showCircles = e.target.checked;
      renderPlan();
    });
    document.getElementById("showCal").addEventListener("change", (e) => {
      S.showCal = e.target.checked;
      renderPlan();
    });
    document.getElementById("btnMeasure").addEventListener("click", () => {
      S.tick++;
      update();
    });
    document.getElementById("autoMeasure").addEventListener("change", (e) => {
      clearInterval(autoTimer);
      if (e.target.checked) autoTimer = setInterval(() => {
        S.tick++;
        update();
      }, 250);
    });
    document.getElementById("btnRecal").addEventListener("click", () => {
      recalibrate();
      update();
    });
    document.querySelectorAll("[data-bind]").forEach((el) => {
      el.addEventListener("input", () => onBound(el, el.type === "checkbox"));
      if (el.type !== "checkbox") el.addEventListener("change", () => onBound(el, true));
    });
    document.querySelectorAll("[data-scene]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.scene === "live") loadScene(liveScene(), { rx: { x: 7.4, y: 3.2 } });
      else if (b.dataset.scene === "six") {
        const c = baseConfig();
        c.env.walls = clone(STANDARD_WALLS);
        loadScene(c, { rx: { x: 7.4, y: 3.2 } });
      } else {
        const c = liveScene();
        c.env.walls = [];
        c.env.aps = [2, 6, 10].map((x, i) => ({ id: `AP${i + 1}`, x, y: 4, offset: 0, enabled: true }));
        loadScene(c, { rx: { x: 7, y: 6 } });
      }
      update();
    }));
    let rt = null;
    window.addEventListener("resize", () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        if (S.tab === "exp") rerenderExperimentCharts();
      }, 150);
    });
    fitView();
    update();
  }
  window.FieldLab = { S, E: engine_exports };
  boot();
})();
</script>
